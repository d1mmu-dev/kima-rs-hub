[workspace]
resolver = "3"
members = ["crates/*", "tools/record-fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
kima-core = { path = "crates/kima-core" }
kima-api = { path = "crates/kima-api" }
kima-api-types = { path = "crates/kima-api-types" }
kima-db = { path = "crates/kima-db" }
kima-ident = { path = "crates/kima-ident" }
kima-jobs = { path = "crates/kima-jobs" }
kima-library = { path = "crates/kima-library" }
kima-net = { path = "crates/kima-net" }
kima-podcast = { path = "crates/kima-podcast" }
kima-subsonic = { path = "crates/kima-subsonic" }
kima-ml = { path = "crates/kima-ml" }
kima-vibe = { path = "crates/kima-vibe" }
kima-test-support = { path = "crates/kima-test-support" }

anyhow = "1"
argon2 = "0.5"
axum = "0.8"
axum-test = "17"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
md-5 = "0.11"
percent-encoding = "2"
form_urlencoded = "1"
quick-xml = "0.37"
notify-debouncer-full = "0.7"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
croner = "2"
futures = "0.3"
http-body-util = "0.1"
jsonwebtoken = "9"
libc = "0.2"
insta = "1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
lofty = "0.25"
pathfinding = "4"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false }
rubato = "0.16"
rusty-chromaprint = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time", "json"] }
symphonia = { version = "0.6", features = ["all"] }
tempfile = "3"
thiserror = "2"
httpdate = "1"
time = { version = "0.3", features = ["serde", "formatting"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
vertigo-cli = "=0.13.4"
walkdir = "2.5"

# argon2 is unbearably slow unoptimised; tests hash passwords.
[profile.dev.package.argon2]
opt-level = 3

# The layout and colour-field loops are plain arithmetic; the 20k-track memory/time test needs them optimised.
[profile.dev.package.kima-vibe]
opt-level = 3

# CLAP decode/preprocessing is per-sample arithmetic: unoptimised it made a debug server ~30x slower
# per track (5-min MP3: decode 63 s vs 1.5 s, one log-mel window 1.4 s vs 0.04 s).
[profile.dev.package.kima-ml]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.symphonia-common]
opt-level = 3

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-bundle-flac]
opt-level = 3

[profile.dev.package.symphonia-codec-aac]
opt-level = 3

[profile.dev.package.symphonia-codec-alac]
opt-level = 3

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3

[profile.dev.package.symphonia-codec-pcm]
opt-level = 3

[profile.dev.package.symphonia-codec-adpcm]
opt-level = 3

[profile.dev.package.symphonia-format-isomp4]
opt-level = 3

[profile.dev.package.symphonia-format-ogg]
opt-level = 3

[profile.dev.package.symphonia-format-riff]
opt-level = 3

[profile.dev.package.symphonia-format-mkv]
opt-level = 3

[profile.dev.package.symphonia-format-caf]
opt-level = 3

[profile.dev.package.symphonia-metadata]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
