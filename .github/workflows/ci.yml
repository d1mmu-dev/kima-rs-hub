name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kima
          POSTGRES_PASSWORD: kima
          POSTGRES_DB: kima
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kima"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Same image under the C locale: the fold tests must hold under both.
      postgres-c:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kima
          POSTGRES_PASSWORD: kima
          POSTGRES_DB: kima
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U kima"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kima:kima@localhost:5432/kima
      SQLX_OFFLINE: "true"
      CI: "true"
      # No test reaches the real network: kima-net panics on any host but this machine.
      KIMA_NET_DENY_REAL: "1"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Failing test lines also go out as annotations, readable without log access.
      - run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log || {
            grep -A2 -E 'panicked at|FAILED|^---- |left:|right:|Error' test.log | head -80 | sed 's/^/::error::/'
            exit 1
          }
      - run: DATABASE_URL=postgres://kima:kima@localhost:5433/kima cargo test -p kima-api --test login_limit
      - run: DATABASE_URL=postgres://kima:kima@localhost:5433/kima cargo test -p kima-subsonic --test auth
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kima
          POSTGRES_PASSWORD: kima
          POSTGRES_DB: kima
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kima"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SQLX_OFFLINE: "true"
      # kima under test makes no outbound lookups (identification off), and kima-net refuses
      # any host but this machine should one slip through.
      KIMA_IDENTIFY: "off"
      KIMA_NET_DENY_REAL: "1"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: cargo build -p kima-server
      - name: Generate fixture library
        run: tools/make-fixture-library.sh "$RUNNER_TEMP/music"
      - name: Start kima
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/organized"
          DATABASE_URL=postgres://kima:kima@localhost:5432/kima \
          KIMA_DATA_DIR="$RUNNER_TEMP/data" \
          KIMA_FRONTEND_DIR=frontend/out \
          MUSIC_PATH="$RUNNER_TEMP/music" \
          KIMA_ORGANIZE_TARGET="$RUNNER_TEMP/organized" \
          KIMA_WATCH_MODE=poll \
          KIMA_IDENTIFY=off \
          KIMA_NET_DENY_REAL=1 \
          PORT=3030 \
          nohup target/debug/kima > "$RUNNER_TEMP/kima.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:3030/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/kima.log"
          exit 1
      - name: Seed stored autotag candidate after the first scan
        env:
          DATABASE_URL: postgres://kima:kima@localhost:5432/kima
        run: |
          ready=0
          for i in $(seq 1 60); do
            if [ "$(psql "$DATABASE_URL" -Atqc "SELECT count(*)=14 AND NOT EXISTS (SELECT 1 FROM jobs WHERE queue='library' AND state IN ('queued','running') AND payload->>'kind'='scan') FROM tracks WHERE missing_since IS NULL")" = t ]; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tools/seed-autotag-candidate.sql
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test -c playwright.kima-rs.config.ts
        working-directory: frontend
      - name: kima log
        if: failure()
        run: cat "$RUNNER_TEMP/kima.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore
  # PLACEHOLDER (M9 Task 0): `crates/kima-web` does not exist until Task 2, which flips `if: false`
  # to `if: true` (deletes the line) and makes this job real. Written now so the toolchain groundwork
  # and its activation are reviewable separately.
  web-wasm:
    if: false
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      # kima-web builds on stable and nightly (see crates/kima-web/README.md); nightly keeps parity with dev.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # wasm-opt (binaryen) is required by `vertigo build`; apt's binaryen is too old, use the release.
      - name: Install wasm-opt
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - run: tools/verify-wasm-toolchain.sh
      # Proves kima-api-types stays wasm-buildable (Task 1 creates it).
      - run: cargo build -p kima-api-types --target wasm32-unknown-unknown
