name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kima
          POSTGRES_PASSWORD: kima
          POSTGRES_DB: kima
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kima"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Same image under the C locale: the fold tests must hold under both.
      postgres-c:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kima
          POSTGRES_PASSWORD: kima
          POSTGRES_DB: kima
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U kima"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kima:kima@localhost:5432/kima
      SQLX_OFFLINE: "true"
      ORT_DYLIB_PATH: /opt/kima/ort/libonnxruntime.so.1.22.0
      CI: "true"
      # No test reaches the real network: kima-net panics on any host but this machine.
      KIMA_NET_DENY_REAL: "1"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # The input-snapshot tests need FICLONE, which the runner's ext4 lacks; they fail loudly
      # without it (docs/m4-input-snapshots.md). Give them a real reflink filesystem (loop XFS,
      # reflink=1) owned by the runner user instead of skipping them, and prove a clone works.
      - name: Reflink filesystem for the input-snapshot tests
        run: |
          sudo apt-get install -y xfsprogs
          img="$RUNNER_TEMP/kima-reflink.img"
          truncate -s 2G "$img"
          mkfs.xfs -q -m reflink=1 "$img"
          sudo mkdir -p /mnt/kima-reflink
          sudo mount -o loop "$img" /mnt/kima-reflink
          sudo chown "$(id -u):$(id -g)" /mnt/kima-reflink
          echo probe > /mnt/kima-reflink/probe
          cp --reflink=always /mnt/kima-reflink/probe /mnt/kima-reflink/probe.clone
          rm /mnt/kima-reflink/probe /mnt/kima-reflink/probe.clone
          findmnt /mnt/kima-reflink
          echo "KIMA_TEST_REFLINK_DIR=/mnt/kima-reflink" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build pinned patched dynamic libsoxr (private prefix)
        run: |
          sudo apt-get install -y gcc make cmake patch curl xz-utils binutils libgomp1
          sh scripts/build-soxr.sh "$RUNNER_TEMP/kima-soxr"
          printf 'LIBRARY_PATH=%s/lib\nLD_LIBRARY_PATH=%s/lib\n' "$RUNNER_TEMP/kima-soxr" "$RUNNER_TEMP/kima-soxr" >> "$GITHUB_ENV"
      - name: Provision verified CPU ONNX Runtime (linux/amd64)
        run: |
          sudo install -d -o root -g root -m 755 /opt/kima
          sudo sh scripts/acquire-ort.sh /opt/kima/ort
          python3 scripts/test-ort-packaging.py
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Native soxr linkage checker self-test
        env:
          TMPDIR: ${{ runner.temp }}
        run: sh scripts/test-soxr-linkage.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Native cold-process and independent waveform regressions, both feature sets
        run: |
          cargo test --locked -p kima-ml --test clap_cold_start --test clap_prepare
          cargo test --locked -p kima-ml --features pg-publish --test clap_cold_start --test clap_prepare
          python3 - <<'PY'
          import json, os, subprocess
          # Ask Cargo where the test binaries are: since Cargo's build-dir layout (stable 2026-11) they
          # are no longer under target/debug/deps.
          for features in ([], ['--features', 'pg-publish']):
              out = subprocess.run(
                  ['cargo', 'test', '--locked', '-p', 'kima-ml', *features, '--test', 'clap_cold_start',
                   '--test', 'clap_prepare', '--no-run', '--message-format=json'],
                  check=True, capture_output=True, text=True).stdout
              found = {}
              for line in out.splitlines():
                  msg = json.loads(line)
                  if msg.get('reason') == 'compiler-artifact' and msg.get('executable') and msg['target']['name'] in ('clap_cold_start', 'clap_prepare'):
                      found[msg['target']['name']] = msg['executable']
              assert set(found) == {'clap_cold_start', 'clap_prepare'}, found
              for binary in found.values():
                  subprocess.run(['sh', 'scripts/check-soxr-linkage.sh', binary, os.environ['RUNNER_TEMP'] + '/kima-soxr'], check=True)
          PY
      # Failing test lines also go out as annotations, readable without log access.
      - run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log || {
            grep -A2 -E 'panicked at|FAILED|^---- |left:|right:|Error' test.log | head -80 | sed 's/^/::error::/'
            exit 1
          }
      - run: DATABASE_URL=postgres://kima:kima@localhost:5433/kima cargo test -p kima-api --test login_limit
      - run: DATABASE_URL=postgres://kima:kima@localhost:5433/kima cargo test -p kima-subsonic --test auth
  # kima-web is the only frontend (Next.js is in no CI path; `frontend/` stays in the repo only as the
  # visual reference for tools/run-kima-web-visual.sh until M10 deletes it).
  kima-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kima
          POSTGRES_PASSWORD: kima
          POSTGRES_DB: kima
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kima"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kima:kima@localhost:5432/kima
      SQLX_OFFLINE: "true"
      KIMA_NET_DENY_REAL: "1"
    steps:
      - uses: actions/checkout@v4
      # kima-web builds on stable and nightly (see crates/kima-web/README.md); nightly keeps parity with dev.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # kima-server links kima-ml (via kima-ident), which needs the pinned dynamic libsoxr.
      - name: Build pinned patched dynamic libsoxr (private prefix)
        run: |
          sudo apt-get install -y gcc make cmake patch curl xz-utils binutils libgomp1
          sh scripts/build-soxr.sh "$RUNNER_TEMP/kima-soxr"
          printf 'LIBRARY_PATH=%s/lib\nLD_LIBRARY_PATH=%s/lib\n' "$RUNNER_TEMP/kima-soxr" "$RUNNER_TEMP/kima-soxr" >> "$GITHUB_ENV"
      # wasm-opt (binaryen) is required by `vertigo build`; apt's binaryen is too old, use the release.
      - name: Install wasm-opt
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - run: tools/verify-wasm-toolchain.sh
      - run: cargo fmt -p kima-web --check
      # Proves kima-api-types stays wasm-buildable.
      - run: cargo build -p kima-api-types --target wasm32-unknown-unknown
      - run: cargo clippy -p kima-web --all-targets -- -D warnings
      - run: cargo clippy -p kima-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test -p kima-web
      # Node is used ONLY here: kima.css is a checked-in Tailwind output, so a stale one must fail. The three
      # packages are installed in a scratch dir at the versions frontend/package-lock.json pins (the legacy
      # frontend's install is not needed); the build and runtime paths never use Node.
      - name: Stale kima.css guard
        run: |
          mkdir "$RUNNER_TEMP/tailwind" && cd "$RUNNER_TEMP/tailwind"
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund --save-exact tailwindcss@4.2.1 @tailwindcss/postcss@4.2.1 postcss@8.5.23
          cd "$GITHUB_WORKSPACE"
          LEGACY_COPY="$RUNNER_TEMP/tailwind" node tools/gen-kima-web-css.mjs --check
      - run: cargo install vertigo-cli --version 0.13.4 --locked
      - run: tools/verify-kima-web-build.sh
      # The embedded SSR tests render the real build; a missing build is a failure here, not a skip.
      - run: KIMA_WEB_REQUIRE_BUILD=1 cargo test -p kima-server --test web_ssr_embed
