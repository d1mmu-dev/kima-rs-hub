[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
kima-core = { path = "crates/kima-core" }
kima-api = { path = "crates/kima-api" }
kima-db = { path = "crates/kima-db" }
kima-jobs = { path = "crates/kima-jobs" }
kima-library = { path = "crates/kima-library" }
kima-subsonic = { path = "crates/kima-subsonic" }

anyhow = "1"
argon2 = "0.5"
axum = "0.8"
axum-test = "17"
base64 = "0.22"
chacha20poly1305 = "0.10"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
md-5 = "0.11"
form_urlencoded = "1"
quick-xml = "0.37"
notify-debouncer-full = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
croner = "2"
futures = "0.3"
http-body-util = "0.1"
jsonwebtoken = "9"
libc = "0.2"
insta = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lofty = "0.25"
rand = "0.8"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time", "json"] }
tempfile = "3"
thiserror = "2"
httpdate = "1"
time = { version = "0.3", features = ["serde", "formatting"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
walkdir = "2.5"

# argon2 is unbearably slow unoptimised; tests hash passwords.
[profile.dev.package.argon2]
opt-level = 3
