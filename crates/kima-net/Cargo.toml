[package]
name = "kima-net"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The replay server tests point the client at (`kima_net::testing`).
testing = ["dep:axum"]

[dependencies]
axum = { workspace = true, optional = true }
base64.workspace = true
kima-core.workspace = true
kima-db.workspace = true
form_urlencoded.workspace = true
percent-encoding.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["rustls-tls", "json", "gzip"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
kima-net = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
